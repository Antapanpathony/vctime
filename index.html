// ---------- RNG ----------
function hashStr(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mkrng(seed) { return { s: seed >>> 0 }; }
function rf(r) { r.s = (r.s + 0x6D2B79F5) >>> 0; let t = r.s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function rr(r, a, b) { return a + (b - a) * rf(r); }
function ri(r, a, b) { return Math.floor(rr(r, a, b + 1)); }
function rc(r, p) { return rf(r) < p; }
function rp(r, arr) { return arr[Math.floor(rf(r) * arr.length)]; }
function rg(r, m = 0, sd = 1) { let u = 0; while (u === 0) u = rf(r); const v = rf(r); return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function rpois(r, lam) { const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= rf(r); } while (p > L && k < 50); return k - 1; }
function rw(r, items, wfn) { let tot = 0; const ws = items.map(it => { const w = Math.max(0, wfn(it)); tot += w; return w; }); if (tot <= 0) return items[Math.floor(rf(r) * items.length)]; let x = rf(r) * tot; for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; } return items[items.length - 1]; }

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sigmoid = x => 1 / (1 + Math.exp(-x));
const lerp = (a, b, t) => a + (b - a) * t;
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);

// ---------- formatting ----------
function fm(n, d) {
  if (n == null || isNaN(n)) return '—';
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n >= 1e9) s = (n / 1e9).toFixed(d != null ? d : n >= 1e10 ? 1 : 2) + 'B';
  else if (n >= 1e6) s = (n / 1e6).toFixed(d != null ? d : n >= 1e7 ? 1 : 2) + 'M';
  else if (n >= 1e3) s = (n / 1e3).toFixed(d != null ? d : n >= 1e5 ? 0 : 1) + 'k';
  else s = Math.round(n).toString();
  return (neg ? '-$' : '$') + s;
}
const fx = (n, d = 2) => (n == null || isNaN(n)) ? '—' : n.toFixed(d) + 'x';
const fp = (n, d = 0) => (n == null || isNaN(n)) ? '—' : (n * 100).toFixed(d) + '%';

function logMsg(text, kind) { G.log.push({ w: G.week, t: text, k: kind || 'info' }); if (G.log.length > 300) G.log.splice(0, 100); }

function pushEvent(type, sid, data) { G.queue.push({ type, sid: sid || 0, data: data || {} }); }

// ---------------------------------------------------------------- new game
function newGame(o) {
  const seed = String(o.seed || Math.floor(Math.random() * 900000 + 100000));
  const size = o.size || 5e6;
  const gp = Math.round(size * 0.02);
  const g = {
    v: 1, seed, rng: mkrng(hashStr(seed + ':world')), week: 0, ap: AP_BASE, apDebt: 0, over: false,
    fundName: o.fundName || 'Bad Haircut Ventures', home: o.home || 'sf', size,
    thesis: Object.assign({ smin: 0, smax: 1, sectors: ['ai', 'saas'], geo: 'region', check: 0.05 }, o.thesis || {}),
    reservePct: o.reservePct != null ? o.reservePct : 0.35,
    called: gp, fundCash: gp, invPaid: 0, dist: 0, carryPaid: 0, flows: [{ w: 0, a: -gp }], gp, reserveLeft: 0, feesPaid: 0, opexPaid: 0,
    cash: 250000 - gp, car: false, staff: { analysts: 0, scouts: [] }, cashHist: [],
    rep: 8, net: 6, lpTrust: 60, vaScore: 0.25, founderRel: 60,
    startups: {}, nextId: 1, names: {}, deals: [], nextDeal: 1, hold: {}, ledger: [],
    heat: {}, heatOu: {}, heatHist: [], macro: { regime: 'normal', since: 0 }, macroHist: [],
    queue: [], log: [], toasts: [], hist: [], reports: [], recent: [], realizedLog: [],
    stats: { sourced: 0, closed: 0, exits: 0, writeoffs: 0, frauds: 0, bestMoic: 0 },
    coldSector: o.thesis && o.thesis.sectors ? o.thesis.sectors[0] : 'ai', quarterBoard: 0,
    divisor: 1,
  };
  SECTORS.forEach(s => { g.heatOu[s.id] = 0; });
  setG(g);
  const D0 = dryPowder();
  g.reserveLeft = Math.max(0, g.reservePct * D0);
  SECTORS.forEach(s => { g.heat[s.id] = sectorHeatAt(s, 0, g.heatOu[s.id]); });
  recordHistory();
  logMsg(`${g.fundName} opens its doors. ${fm(size)} committed, ${fm(gp)} of it yours. Try not to lose it.`, 'good');
  return g;
}

function sectorHeatAt(sec, w, ou) { return clamp(sec.amp * Math.sin(2 * Math.PI * (w / sec.period + sec.phase)) + ou, -1, 1); }

// ---------------------------------------------------------------- fund money
function weeksLeft() { return Math.max(0, FUND_WEEKS - G.week); }
function annualFee() { return G.size * FEE_PCT; }
function uncalled() { return G.size - G.called; }
function dryPowder() { return uncalled() + G.fundCash - annualFee() / 52 * weeksLeft() - G.size * 0.01; }
function generalPowder() { return dryPowder() - G.reserveLeft; }
// spend money from the fund: idle cash (the GP commit) first, then call capital from LPs
function callCapital(amt, kind) {
  amt = Math.min(amt, Math.max(0, uncalled() + G.fundCash));
  const fromCash = Math.min(G.fundCash, amt); G.fundCash -= fromCash;
  const call = amt - fromCash;
  if (call > 0) { G.called += call; G.flows.push({ w: G.week, a: -call }); }
  if (kind === 'fee') G.feesPaid += amt; else if (kind === 'opex') G.opexPaid += amt; else if (kind === 'inv') G.invPaid += amt;
  return amt;
}
function distribute(amt) {
  if (amt <= 0) return;
  G.dist += amt;
  const carryDue = Math.max(0, CARRY_PCT * (G.dist - G.called) - G.carryPaid);
  G.carryPaid += carryDue;
  const net = amt - carryDue;
  G.flows.push({ w: G.week, a: net });
  G.cash += carryDue + net * (G.gp / G.size);
  return { carry: carryDue, net };
}

// ---------------------------------------------------------------- knowledge
function noiseMult() { return Math.pow(0.88, G.staff.analysts); }
function onThesis(s) { return thesisFit(s).ok; }
function fitMult(s) { return onThesis(s) ? 0.82 : 1.2; }
function know(s, stat, obs, sigma) {
  obs = clamp(obs, 0, 100);
  const k = s.know[stat], v2 = sigma * sigma;
  if (!k) { s.know[stat] = { m: obs, v: v2 }; return; }
  const nv = 1 / (1 / k.v + 1 / v2);
  k.m = nv * (k.m / k.v + obs / v2); k.v = nv;
}
function observe(s, stat, sigma, bias) {
  const sg = sigma * noiseMult() * fitMult(s);
  const obs = s.h[stat] + (bias || 0) + rg(G.rng, 0, sg);
  know(s, stat, obs, sg);
  return obs;
}

// ---------------------------------------------------------------- thesis
function cityRelation(cityId) {
  const h = CITY_BY_ID[G.home], c = CITY_BY_ID[cityId];
  if (c.id === h.id) return 'local';
  if (c.region === h.region) return 'region';
  return 'far';
}
function thesisFit(s) {
  const t = G.thesis, k = s.round ? s.round.stage : s.done + 1;
  const stage = k >= t.smin && k <= t.smax;
  const sector = t.sectors.includes(s.sector);
  const rel = cityRelation(s.city);
  const geo = t.geo === 'global' || (t.geo === 'region' && rel !== 'far') || (t.geo === 'local' && rel === 'local');
  return { stage, sector, geo, ok: stage && sector && geo };
}
function driftLevel() {
  if (!G.recent.length) return 0;
  const n = G.recent.slice(-8);
  return n.filter(x => x).length / n.length;
}
function biasFactor() { return clamp(1 - Math.max(0, driftLevel() - 0.2) * 1.2, 0.25, 1); }

// ---------------------------------------------------------------- startup generation
function invented(r) {
  const C = 'bdfgklmnprstvz', V = 'aeiou'; let s = ''; const n = ri(r, 2, 3);
  for (let i = 0; i < n; i++) s += C[ri(r, 0, C.length - 1)] + V[ri(r, 0, V.length - 1)];
  return s[0].toUpperCase() + s.slice(1) + (rc(r, 0.4) ? rp(r, ['x', 'n', 'ly', 'a', 'io']) : '');
}
function genName(r, sec) {
  for (let t = 0; t < 30; t++) {
    const m = rf(r); let nm;
    if (m < 0.45) nm = rp(r, sec.pre) + rp(r, sec.suf);
    else if (m < 0.7) nm = rp(r, sec.pre) + ' ' + rp(r, ['Labs', 'Systems', 'Co', 'Group', 'Works', 'Collective', 'Analytics']);
    else nm = invented(r);
    nm = nm.replace(/^(.)(.*)$/, (a, b, c) => b.toUpperCase() + c);
    if (!G.names[nm]) { G.names[nm] = 1; return nm; }
  }
  const nm = invented(r) + ri(r, 2, 99); G.names[nm] = 1; return nm;
}
function pickQuirk(r, h) {
  const m = rf(r);
  if (m < 0.22) return rc(r, 0.5 + (50 - h.I) / 120) && h.I < 55 ? rp(r, QUIRK_BAD_I) : (h.I > 70 ? rp(r, QUIRK_GOOD_I) : rp(r, QUIRK_FLAVOR));
  if (m < 0.40) return h.F > 62 && rc(r, 0.75) ? rp(r, QUIRK_GOOD_F) : (h.F < 42 && rc(r, 0.75) ? rp(r, QUIRK_BAD_F) : rp(r, QUIRK_FLAVOR));
  if (m < 0.47) return rp(r, rc(r, 0.5) ? QUIRK_BAD_I : QUIRK_BAD_F);
  return rp(r, QUIRK_FLAVOR);
}

function pickCity(r, bias) {
  const home = CITY_BY_ID[G.home];
  const x = rf(r);
  const pLocal = 0.5 + 0.18 * (1 - bias), pReg = 0.25;
  if (x < pLocal) return home.id;
  const same = CITIES.filter(c => c.region === home.region && c.id !== home.id);
  if (x < pLocal + pReg && same.length) return rp(r, same).id;
  const other = CITIES.filter(c => c.region !== home.region);
  return rp(r, other).id;
}

function genStartup(o) {
  const id = G.nextId++;
  const r = mkrng(hashStr(G.seed + ':s' + id));
  const sec = SECTOR_BY_ID[o.sector];
  const Q = clamp(o.q, 4, 97);
  const h = {};
  h.F = clamp(Q + rg(r, 0, 13), 3, 98);
  h.P = clamp(Q + rg(r, 0, 15), 3, 98);
  h.T = clamp(50 + 0.35 * (Q - 50) + rg(r, 0, 17) + 8 * G.heat[o.sector], 3, 98);
  h.B = clamp(rg(r, 52, 18) + 0.1 * (Q - 50), 3, 98);
  h.X = clamp(Q + rg(r, 0, 17), 3, 98);
  const fraud = rc(r, sec.fraud * (Q < 40 ? 1.6 : Q > 70 ? 0.35 : 1));
  h.I = fraud ? rr(r, 3, 20) : clamp(rg(r, 62 + 0.2 * (Q - 50), 16), 25, 98);
  if (fraud) { h.P = Math.min(h.P, rr(r, 8, 42)); }
  const s = {
    id, name: genName(r, sec), sector: o.sector, city: o.city || pickCity(r, 1),
    founder: { name: rp(r, FIRST) + ' ' + rp(r, LAST) }, q: Q, h, fraud,
    breakout: h.P >= 82 && h.F >= 68 && h.T >= 58,
    pitch: rp(r, sec.what) + ' for ' + rp(r, sec.who),
    rs: r, born: G.week, status: 'private', know: {},
    done: -1, rounds: [], cap: { founders: 8e6, pool: 1e6, inv: [] }, safes: [], lowSafeCap: Infinity,
    mrr: 0, expense: 0, cash: 0, gMod: 0, dress: 0, distress: 1, fails: 0, round: null, lastRaiseW: G.week, pivotW: -99,
    saleBoost: 1, shock: 0, stallUntil: 0,
  };
  s.founder.quirk = pickQuirk(r, h);
  s.potential = 12e6 * Math.exp(0.095 * (0.45 * h.P + 0.25 * h.T + 0.3 * h.F - 50)) * Math.exp(rg(r, 0, 0.5)) * (s.breakout ? 2.6 : 1);
  s.dress = fraud ? rr(r, 0.35, 0.8) : Math.max(0, (100 - h.I) / 100 * rr(r, 0.05, 0.25));
  setupFinancials(s, o.stage);
  openRound(s, o.stage, o.fast);
  G.startups[id] = s;
  return s;
}

function sectorHeat(id) { return G.heat[id] || 0; }

function setupFinancials(s, r0) {
  const r = s.rs, h = s.h;
  // backfill earlier rounds so the cap table makes sense
  for (let k = 0; k < r0; k++) {
    const st = stg(k);
    const pre = st.pre * rr(r, 0.75, 1.5) * Math.pow(s.q / 50, 0.8), raise = st.raise * rr(r, 0.8, 1.2);
    const post = pre + raise;
    const poolPct = 0.10;
    const N = s.cap.founders + s.cap.pool + sum(s.cap.inv, x => x.shares);
    let postFD = (N - s.cap.pool) / (1 - poolPct - raise / post);
    if (poolPct * postFD < s.cap.pool) postFD = N / (1 - raise / post);
    const pps = post / postFD, newInv = raise / pps;
    s.cap.pool = Math.max(s.cap.pool, poolPct * postFD);
    s.cap.inv.push({ name: STAGES[k].short + ' investors', shares: newInv });
    s.rounds.push({ stage: k, pre, post, raise, pps, week: G.week - 60 + k * 10, lead: 'Earlier investors', down: false });
    s.done = k;
  }
  if (r0 === 0) {
    s.mrr = rr(r, 800, 5500);
    const net = STAGES[0].burnMo * rr(r, 0.6, 1.3);
    s.expense = s.mrr + net; s.cash = net * rr(r, 3.2, 6.5);
  } else {
    const arr = STAGES[r0].bench * Math.exp((h.P - 52) / 26) * rr(r, 0.65, 1.2);
    s.mrr = arr / 12;
    const net = STAGES[r0].burnMo * rr(r, 0.7, 1.3) * (1.25 - h.B / 200);
    s.expense = s.mrr + net; s.cash = net * rr(r, 3.2, 6.5);
  }
}

function perceivedRatio(s, k) {
  const h = s.h;
  const team = Math.exp((0.45 * h.F + 0.4 * h.P + 0.15 * h.T - 50) / 22);
  if (k === 0) return team;
  const rev = Math.max(0.02, s.mrr * 12 * (1 + s.dress * 0.7) / stg(k).bench);
  return k === 1 ? Math.sqrt(rev * team) : rev;
}
function fairPre(s, k) {
  const st = stg(k);
  const r = perceivedRatio(s, k);
  const em = Math.pow(SECTOR_BY_ID[s.sector].em, 0.6);
  return st.pre * Math.pow(clamp(r, 0.25, 4), 0.8) * (1 + 0.3 * sectorHeat(s.sector)) * MACRO[G.macro.regime].val * em;
}

// open a funding round for a startup (the thing sitting in your pipeline)
function openRound(s, k, fast) {
  const r = s.rs, st = stg(k);
  const ratio = perceivedRatio(s, k);
  const fair = fairPre(s, k);
  const greed = rr(r, 1.0, 1.28);
  const raise = st.raise * Math.pow(clamp(ratio, 0.5, 2), 0.4) * rr(r, 0.9, 1.15);
  const safeP = k === 0 ? 0.65 : k === 1 ? 0.35 : 0;
  const safe = rc(r, safeP);
  const [wa, wb] = st.weeksOpen;
  s.round = {
    stage: k, fair, ask: fair * greed, raise, safe, poolPct: 0.10, greed,
    start: G.week, end: G.week + (fast ? ri(r, 2, 3) : ri(r, wa, wb)), signal: 0, prep: 0, mySlice: 0, taken: false,
    rivals: makeRivals(s, k, fair, greed),
  };
  if (safe) s.round.ask = s.round.ask * 1.05; // cap is quoted post-money-ish
  return s.round;
}

function marketQ(s) { return 0.4 * s.h.F + 0.4 * s.h.P + 0.2 * s.h.T; }
function makeRivals(s, k, fair, greed) {
  const r = s.rs;
  const qm = marketQ(s) + rg(r, 0, 4);
  const stageF = [0.7, 1.0, 1.2, 1.3, 1.3, 1.3, 1.3, 1.3][k];
  const lam = clamp((qm - 38) / 16, 0, 3.2) * (1 + 0.35 * sectorHeat(s.sector)) * stageF * (s.fraud ? 0.5 : 1);
  const n = Math.min(4, rpois(r, lam));
  const out = [];
  const elig = RIVALS.filter(f => Math.min(5, k) >= f.stages[0] && Math.min(5, k) <= f.stages[1]);
  for (let i = 0; i < n && elig.length; i++) {
    const f = rw(r, elig.filter(e => !out.find(o => o.id === e.id)), e => (e.sectors ? (e.sectors.includes(s.sector) ? 2.2 : 0.4) : 1) * (0.5 + e.brand / 100));
    if (!f) break;
    const prem = fair * (1 + f.pay + rg(r, 0, 0.05));
    const u = (f.brand - 50) / 50 + 3.2 * Math.log(prem / (fair * greed)) + f.friendly * 0.8 + f.speed * 0.4 + f.va * 0.4 + rg(r, 0, 0.22);
    out.push({ id: f.id, name: f.name, u, pre: prem });
  }
  return out;
}

// ---------------------------------------------------------------- cap table math
function fd(s) {
  let t = s.cap.founders + s.cap.pool;
  for (const i of s.cap.inv) t += i.shares;
  const h = G.hold[s.id];
  if (h) for (const tr of h.tr) t += tr.shares || 0;
  return t;
}
function prefTotal(s) { return Math.max(1, sum(s.rounds, x => x.raise) + sum(s.safes, x => x.invested)); }
function lastPost(s) { return s.rounds.length ? s.rounds[s.rounds.length - 1].post : 0; }

// price + close a round. o: {pre, raise, lead, poolPct, mine:[{invested, pref, anti, board, prorata, safe, cap, mfn, disc, kind}] , safeRound}
function closeRound(s, o) {
  const k = s.round ? s.round.stage : s.done + 1;
  const w = G.week;
  const h0 = G.hold[s.id];
  if (o.safeRound) {
    // SAFE round: money in, valuation cap recorded; converts at next priced round
    const cap = o.pre;
    s.cash += o.raise;
    const mineInv = sum(o.mine || [], t => t.invested);
    const otherInv = Math.max(0, o.raise - mineInv);
    if (otherInv > 0) s.safes.push({ who: 'other', invested: otherInv, cap, disc: rc(s.rs, 0.5) ? 0.2 : 0, mfn: false, name: o.lead });
    for (const t of (o.mine || [])) {
      const tr = addTranche(s, { kind: 'safe', invested: t.invested, cap, disc: t.disc || 0, mfn: !!t.mfn, pref: '1x', anti: 'none' });
      s.safes.push({ who: 'me', tid: tr.id, invested: t.invested, cap, disc: t.disc || 0, mfn: !!t.mfn });
    }
    s.lowSafeCap = Math.min(s.lowSafeCap, cap);
    s.rounds.push({ stage: k, pre: cap, post: cap, raise: o.raise, pps: 0, week: w, lead: o.lead, down: false, safe: true });
    s.done = k;
  } else {
    const pre = o.pre, raise = o.raise, post = pre + raise;
    // convert safes / notes
    const Nbase = s.cap.founders + s.cap.pool + sum(s.cap.inv, x => x.shares) + (h0 ? sum(h0.tr, t => t.shares || 0) : 0);
    let safeShares = 0; const conv = [];
    for (const sf of s.safes) {
      const capV = Math.min(sf.cap || Infinity, sf.mfn ? s.lowSafeCap : Infinity);
      const convVal = Math.min(capV, pre * (1 - (sf.disc || 0)));
      const sh = sf.invested / convVal * Nbase;
      safeShares += sh; conv.push([sf, sh]);
    }
    const N = Nbase + safeShares;
    const poolPct = o.poolPct != null ? o.poolPct : 0.10;
    let postFD = (N - s.cap.pool) / (1 - poolPct - raise / post);
    if (poolPct * postFD < s.cap.pool) postFD = N / (1 - raise / post);
    const pps = post / postFD;
    const prevPps = s.rounds.length ? lastPps(s) : 0;
    const down = prevPps > 0 && pps < prevPps * 0.98;
    // convert
    for (const [sf, sh] of conv) {
      if (sf.who === 'me') {
        const tr = h0.tr.find(t => t.id === sf.tid);
        if (tr) { tr.shares = sh; tr.cp = tr.invested / sh; tr.converted = true; }
      } else s.cap.inv.push({ name: sf.name || 'SAFE holders', shares: sh });
    }
    s.safes = [];
    // anti-dilution on my earlier priced tranches
    if (down && h0) {
      const A = N, newShares = raise / pps;
      for (const t of h0.tr) {
        if (!t.shares || t.kind === 'safe' || t.anti === 'none' || !t.cp) continue;
        if (pps >= t.cp) continue;
        let cp2;
        if (t.anti === 'ratchet') cp2 = pps;
        else { const B = raise / t.cp; cp2 = t.cp * (A + B) / (A + newShares); }
        const ns = t.invested / cp2;
        if (ns > t.shares) { t.adjust = (t.adjust || 0) + (ns - t.shares); t.shares = ns; t.cp = cp2; s.antiTriggered = true; }
      }
    }
    // pool top-up
    const poolAdd = Math.max(0, poolPct * postFD - s.cap.pool);
    s.cap.pool += poolAdd;
    // new investors
    let myShares = 0;
    for (const t of (o.mine || [])) {
      const tr = addTranche(s, { kind: t.kind || 'priced', invested: t.invested, pps, cp: pps, pref: t.pref || '1x', anti: t.anti || 'wa' });
      tr.shares = t.invested / pps; myShares += tr.shares;
    }
    s.cap.inv.push({ name: o.lead, shares: Math.max(0, raise / pps - myShares) });
    s.cash += raise;
    s.rounds.push({ stage: k, pre, post, raise, pps, week: w, lead: o.lead, down });
    s.done = k;
    s.lastDown = down;
  }
  s.round = null; s.fails = 0; s.lastRaiseW = w; s.distress = 1;
  // reset burn plan
  const plan = 12 + s.h.B / 100 * 12;
  s.expense = s.mrr + Math.max(stg(k).burnMo * 0.5, s.cash / plan);
  s.stallUntil = 0;
  return s.rounds[s.rounds.length - 1];
}
function lastPps(s) { for (let i = s.rounds.length - 1; i >= 0; i--) if (s.rounds[i].pps > 0) return s.rounds[i].pps; return 0; }

function addTranche(s, t) {
  let h = G.hold[s.id];
  if (!h) {
    h = G.hold[s.id] = { sid: s.id, tr: [], invested: 0, realized: 0, board: false, prorata: false, lead: false, rel: 60, status: 'active', since: G.week, helpCd: {}, nextTr: 1, lockUntil: 0, exitW: 0, spent: {}, diligence: 0 };
  }
  t.id = h.nextTr++; t.w = G.week; t.shares = t.shares || 0;
  h.tr.push(t); h.invested += t.invested;
  return t;
}

// ---------------------------------------------------------------- holdings valuation
function equityMark(s) {
  if (s.status === 'dead') return 0;
  if (s.status === 'public') return s.mcap;
  if (!s.rounds.length) return 0;
  let v = lastPost(s) * s.distress;
  // stale + profitable → mark to ARR model
  const stale = G.week - s.lastRaiseW;
  if (stale > 70 && s.mrr > s.expense * 0.9) v = Math.max(v, s.mrr * 12 * 10 * MACRO[G.macro.regime].exit);
  return v;
}
function ownPct(s, h) {
  h = h || G.hold[s.id]; if (!h) return 0;
  const f = fd(s);
  // converted shares + a post-money-style estimate for SAFEs / notes that have not converted yet
  return sum(h.tr, t => t.shares || 0) / f + sum(h.tr.filter(t => !t.shares), t => t.invested / Math.max(1, t.cap && isFinite(t.cap) ? t.cap : (lastPost(s) || t.invested * 10) * 0.8));
}
function holdingMark(h) {
  const s = G.startups[h.sid];
  if (!s || h.status !== 'active') return 0;
  if (s.status === 'dead') return 0;
  const eq = equityMark(s), f = fd(s);
  let v = 0;
  for (const t of h.tr) {
    if (t.shares) v += t.shares / f * eq;
    else v += t.invested * (s.rounds.length && t.kind === 'safe' ? Math.max(1, lastPost(s) / t.cap * 0.9) : 1) * s.distress;
  }
  return v;
}
function holdingCost(h) { return h.invested; }

// payout for a holding if company sold for equity value EV
function exitPayout(s, h, EV) {
  const pt = prefTotal(s), f = fd(s);
  let pay = 0;
  for (const t of h.tr) {
    if (!t.shares) { // unconverted SAFE / note
      pay += EV <= pt ? EV * t.invested / pt : t.invested * Math.max(1, EV / (t.cap || lastPost(s) || EV));
      continue;
    }
    const own = t.shares / f;
    if (EV <= pt) pay += EV * t.invested / pt;
    else if (t.pref === 'part') pay += t.invested + own * (EV - pt);
    else pay += Math.max(t.invested, own * EV);
  }
  return pay;
}
function arr(s) { return s.mrr * 12; }

// ---------------------------------------------------------------- misc helpers
function dealsOf(sid) { return G.deals.filter(d => d.sid === sid && d.status === 'open'); }
function endDeal(d, status, why) { d.status = status; d.why = why; d.endW = G.week; if (d.col >= 1 && status !== 'closed') { addLedger(d); } }
function addLedger(d) {
  const s = G.startups[d.sid]; if (!s) return;
  if (G.ledger.find(l => l.sid === d.sid)) return;
  G.ledger.push({ sid: d.sid, name: s.name, sector: s.sector, w: G.week, stage: d.stage, ask: d.ask, why: d.why || 'passed', pre: s.round ? s.round.ask : 0 });
}
function recordHistory() {
  const m = fundMetrics();
  G.hist.push({ w: G.week, tvpi: m.tvpi, dpi: m.dpi, nav: m.nav, paid: m.paidIn, dist: G.dist });
}

function acqhireEV(s) {
  const M = MACRO[G.macro.regime];
  return Math.max(s.cash * 0.6, headcount(s) * rr(s.rs, 0.05e6, 0.28e6) * M.val + arr(s) * 0.6);
}

// ============================================================================
// WORLD: weekly engine — startups, rounds, crises, exits, sourcing, macro
// ============================================================================

function growthMo(s) {
  const h = s.h, k = Math.min(s.done + 1, 5);
  let g = ((h.P - 30) / 100 * 0.21 + (h.F - 50) / 100 * 0.04 + (h.T - 50) / 100 * 0.05) * STAGES[k].damp + 0.015 * sectorHeat(s.sector) + s.gMod;
  if (s.breakout) g *= 1.18;
  if (g > 0) g *= Math.max(0.03, 1 - s.mrr * 12 / s.potential) / (1 + 0.25 * Math.sqrt(s.mrr * 12 / 8e6)); // market ceiling + law of large numbers
  if (s.fraud) g = Math.min(g, 0.01);
  return g;
}
function netBurn(s) { return s.expense - s.mrr; }
function runwayMo(s) { const nb = netBurn(s); return nb > 1 ? s.cash / nb : 99; }
function headcount(s) { return Math.max(2, Math.round(s.expense / 14500)); }

function stepStartup(s) {
  const r = s.rs;
  if (s.status === 'public') { stepPublic(s); return; }
  if (s.status !== 'private') return;
  const h = G.hold[s.id], held = h && h.status === 'active';
  // operating
  s.gMod += -0.05 * s.gMod + rg(r, 0, 0.006);
  let g = growthMo(s);
  if (rc(r, 0.0025)) s.gMod -= rr(r, 0.015, 0.04); // a bad quarter: competitor, churn, reorg
  if (G.week < s.stallUntil) g = Math.min(g, 0);
  const gw = g / 4.345 + rg(r, 0, 0.01);
  if (s.mrr < 400 && s.done < 1) s.mrr += rr(r, 0, 60) * Math.max(0, g * 8); // pre-revenue trickle
  else s.mrr = Math.max(0, s.mrr * (1 + gw));
  if (gw > 0) s.expense *= 1 + (s.mrr > s.expense * 0.8 ? 0.9 : 0.5) * gw;
  s.expense = Math.max(s.expense, s.mrr * 0.35);
  s.cash -= netBurn(s) / 4.345;
  // fundraising state machine
  if (s.round) {
    if (!s.round.taken && G.week >= s.round.end) resolveRound(s);
  } else if (s.done < 8) {
    const rw_ = runwayMo(s);
    const strong = perceivedRatio(s, s.done + 1) > 1.6 && rw_ < 15 && rc(r, 0.03);
    if (rw_ < 7 || strong) startRaise(s);
  }
  if (s.status !== 'private') return;
  if (s.cash <= 0 && !s.round) { collapse(s, 'ran out of cash'); return; }
  if (s.cash <= -netBurn(s) && s.round) { collapse(s, 'ran out of cash mid-raise'); return; }
  // random hazards
  if (!held && rc(r, 0.0004)) { collapse(s, 'imploded'); return; }
  // exit interest
  if (s.done >= 2) exitInterest(s, h, held);
  // fraud reveal
  if (held && h.fraudAt && G.week >= h.fraudAt && !h.fraudDone) {
    h.fraudDone = true; pushEvent('fraud', s.id);
  }
}

function startRaise(s) {
  const k = s.done + 1;
  if (k > 8) return;
  openRound(s, k, false);
  const h = G.hold[s.id];
  if (h && h.status === 'active') {
    const rd = s.round;
    if (h.prorata || h.rel >= 55) pushEvent('followon', s.id, { k });
    else logMsg(`${s.name} is raising ${stageName(k)} — the founder didn't offer you an allocation.`, 'warn');
  } else {
    const l = G.ledger.find(x => x.sid === s.id);
    if (l && !G.deals.some(d => d.sid === s.id && d.status === 'open') && rc(G.rng, 0.6) && s.status === 'private') {
      const d = makeDeal(s, 'resurface'); d.col = 0;
      logMsg(`${s.name} (you passed earlier) is back, raising ${stageName(k)}.`, 'info');
    }
  }
}

function resolveRound(s) {
  const rd = s.round, k = rd.stage, r = s.rs;
  const M = MACRO[G.macro.regime];
  const ratio = perceivedRatio(s, k);
  const z = 3 * Math.log(Math.max(0.05, ratio)) + 1.0 + 0.9 * sectorHeat(s.sector) + M.raise + rd.signal + rd.prep + 0.25 * rd.rivals.length - 0.7 * s.fails - (rd.rivals.length ? 0 : 0.3);
  const h = G.hold[s.id], held = h && h.status === 'active';
  if (rf(r) >= sigmoid(z)) { failRaise(s, ratio); return; }
  let pre = fairPre(s, k) * rr(r, 0.93, 1.1);
  if (ratio < 0.6 && s.rounds.length) pre = Math.min(pre, lastPost(s) * rr(r, 0.55, 0.9));
  if (rd.safe) pre *= 1.05;
  const best = rd.rivals.slice().sort((a, b) => b.u - a.u)[0];
  const lead = best ? best.name : (held ? 'Insider-led' : 'Strategic angels');
  const mine = [];
  if (held && rd.mySlice > 0 && !rd.safe) {
    const amt = payFollowOn(rd.mySlice);
    if (amt > 0) mine.push({ invested: amt, pref: '1x', anti: 'wa' });
  } else if (held && rd.mySlice > 0 && rd.safe) {
    const amt = payFollowOn(rd.mySlice);
    if (amt > 0) mine.push({ invested: amt, disc: 0 });
  }
  const prevMark = held ? holdingMark(h) : 0;
  const rec = closeRound(s, { pre, raise: rd.raise, lead, poolPct: 0.10, mine, safeRound: rd.safe });
  if (best) { G.rivalWins = G.rivalWins || {}; G.rivalWins[best.id] = (G.rivalWins[best.id] || 0) + 1; }
  // pipeline fallout
  for (const d of dealsOf(s.id)) endDeal(d, 'lost', `${lead} closed the round`);
  if (held) {
    const up = !rec.down;
    const mark = holdingMark(h);
    logMsg(`${s.name} closed ${stageName(k)}${rec.safe ? ' (SAFE)' : ''}: ${fm(rec.raise)} at ${fm(rec.post)} post, led by ${lead}.${rec.down ? ' DOWN ROUND.' : ''}`, rec.down ? 'bad' : 'good');
    if (up) { G.rep = Math.min(100, G.rep + (h.lead ? 0.35 : 0.15)); if (mark > h.invested * 3) G.net += 0.2; }
    if (rec.down && s.antiTriggered) { s.antiTriggered = false; pushEvent('antidil', s.id); }
    if (mine.length) G.net += 0.5;
  }
  s.stallUntil = 0;
}

function payFollowOn(amt) {
  amt = Math.min(amt, Math.max(0, uncalled() + G.fundCash - annualFee() / 52 * weeksLeft() * 0.5));
  if (amt <= 0) return 0;
  const fromRes = Math.min(G.reserveLeft, amt);
  G.reserveLeft -= fromRes;
  callCapital(amt, 'inv');
  return amt;
}

function failRaise(s, ratio) {
  s.round = null; s.fails++;
  const h = G.hold[s.id], held = h && h.status === 'active';
  for (const d of dealsOf(s.id)) endDeal(d, 'lost', 'round fell apart');
  const rw_ = runwayMo(s);
  if (rw_ > 3.2 && s.fails < 3) { // try again shortly
    s.retryOk = true; return;
  }
  if (held) {
    if (ratio > 0.3 && s.fails < 3 && rc(G.rng, 0.6)) pushEvent('downround', s.id, { ratio });
    else pushEvent('runway', s.id);
  } else npcCrisis(s, ratio);
}

function npcCrisis(s, ratio) {
  const r = s.rs;
  if (s.fails < 3 && rc(r, 0.4)) { // insider bridge
    s.cash += s.expense * 4; s.distress = 0.7; s.stallUntil = G.week + 4; return;
  }
  if (rc(r, 0.45)) { npcSale(s, acqhireEV(s), 'acqui-hired'); return; }
  collapse(s, 'ran out of runway');
}
function npcSale(s, ev, why) {
  s.status = 'acquired'; s.exitEV = ev; s.exitW = G.week; s.exitWhy = why;
  for (const d of dealsOf(s.id)) endDeal(d, 'lost', why);
}

// a company dies
function collapse(s, why) {
  const h = G.hold[s.id];
  s.status = 'dead'; s.deadW = G.week; s.deadWhy = why; s.round = null;
  for (const d of dealsOf(s.id)) endDeal(d, 'lost', 'company ' + why);
  if (h && h.status === 'active') {
    const EV = Math.max(0, s.cash) * 0.4;
    const pay = exitPayout(s, h, EV);
    writeOff(h, pay, why);
  }
}
function writeOff(h, recovered, why) {
  const s = G.startups[h.sid];
  if (recovered > 0) distribute(recovered);
  h.realized += recovered; h.status = 'written-off'; h.exitW = G.week;
  G.stats.writeoffs++;
  G.rep = Math.max(0, G.rep - 0.25);
  const loss = h.invested - recovered;
  logMsg(`${s.name} ${why || 'shut down'}. You lose ${fm(loss)} (${recovered > 0 ? 'recovered ' + fm(recovered) : 'nothing recovered'}).`, 'bad');
  G.realizedLog.push({ sid: h.sid, name: s.name, invested: h.invested, got: h.realized, w: G.week, kind: 'writeoff' });
}

// ------------------------------------------------------------------ exits
function exitMult(s) {
  const M = MACRO[G.macro.regime];
  const base = [4, 6, 9, 10.5, 11.5, 12.5][Math.min(5, s.done)];
  return base * Math.pow(SECTOR_BY_ID[s.sector].em, 0.7) * M.exit * (1 + 0.25 * sectorHeat(s.sector)) * (s.breakout ? 1.25 : 1);
}
function exitInterest(s, h, held) {
  const r = s.rs, a = arr(s);
  if (a < 0.5e6) return;
  // IPO window
  const M = MACRO[G.macro.regime];
  if (s.done >= 3 && a > 35e6 && M.ipo > 0) {
    const p = M.ipo * 0.02 * clamp(a / 60e6, 0.5, 2) * (1 + sectorHeat(s.sector));
    if (rc(r, p)) {
      const ev = a * 14 * M.exit * rr(r, 0.85, 1.3) * (s.breakout ? 1.3 : 1) * (1 + 0.3 * sectorHeat(s.sector));
      if (held) { if (!pendingOffer(s.id)) pushEvent('exitoffer', s.id, { kind: 'ipo', ev, cash: false }); }
      else goPublic(s, ev, 0.04);
      return;
    }
  }
  // M&A
  const p = 0.0022 * (1 + Math.max(0, sectorHeat(s.sector))) * (a > 3e6 ? 1.4 : 0.7) * (s.done >= 4 ? 1.3 : 1);
  if (rc(r, p)) {
    const ev = a * exitMult(s) * rr(r, 0.85, 1.3);
    if (ev < 0.6 * equityMark(s)) return;
    if (held) {
      if (pendingOffer(s.id)) return;
      const cash = rc(r, 0.62), opposes = rc(r, 0.3);
      if (opposes && !h.board) { logMsg(`An acquirer approached ${s.name} at ${fm(ev)}; the founder turned it down. (A board seat would have given you a vote.)`, 'warn'); return; }
      pushEvent('exitoffer', s.id, { kind: 'ma', ev, cash, opposes });
    } else if (rc(r, 0.6)) npcSale(s, ev, 'acquired');
  }
}
function pendingOffer(sid) { return G.queue.some(e => e.type === 'exitoffer' && e.sid === sid); }

function goPublic(s, ev, vol) {
  s.status = 'public'; s.mcap = ev; s.ipoW = G.week; s.vol = vol || 0.04; s.mcap0 = ev;
  for (const d of dealsOf(s.id)) endDeal(d, 'lost', 'went public');
  s.round = null;
}
function stepPublic(s) {
  const M = MACRO[G.macro.regime];
  const r = G.rng;
  s.mcap *= Math.exp(M.drift + 0.0006 * (s.q - 50) / 50 + rg(r, 0, s.vol || 0.04));
  const h = G.hold[s.id];
  if (!h || h.status !== 'active') { if (G.week - (s.ipoW || 0) > 30) s.status = 'exited'; }
}
function publicValue(h) { const s = G.startups[h.sid]; return s.mcap * ownPct(s, h) * (h.stockDeal ? 1 : 1); }

// realise a holding (accept an acquisition offer or sale)
function sellHolding(h, EV, label) {
  const s = G.startups[h.sid];
  const pay = exitPayout(s, h, EV);
  distribute(pay);
  h.realized += pay; h.status = 'exited'; h.exitW = G.week;
  s.status = 'acquired'; s.exitEV = EV; s.exitW = G.week;
  finishExit(h, pay, label);
  return pay;
}
function finishExit(h, pay, label) {
  const s = G.startups[h.sid];
  const moic = h.realized / Math.max(1, h.invested);
  G.stats.exits++; G.stats.bestMoic = Math.max(G.stats.bestMoic, moic);
  if (moic > 10) G.rep = Math.min(100, G.rep + 5); else if (moic > 3) G.rep = Math.min(100, G.rep + 2); else if (moic > 1.2) G.rep = Math.min(100, G.rep + 0.7);
  G.realizedLog.push({ sid: h.sid, name: s.name, invested: h.invested, got: h.realized, w: G.week, kind: label || 'exit' });
  logMsg(`${label || 'Exit'}: ${s.name} — ${fm(h.invested)} → ${fm(h.realized)} (${fx(moic, 1)}).`, moic >= 1 ? 'good' : 'bad');
  for (const d of dealsOf(s.id)) endDeal(d, 'lost', 'sold');
}

// ------------------------------------------------------------------ deals
function makeDeal(s, channel) {
  const d = { id: G.nextDeal++, sid: s.id, col: 0, status: 'open', channel, w0: G.week, movedW: -1, tools: {}, notes: [], stage: s.round ? s.round.stage : s.done + 1, ask: s.round ? s.round.ask : 0, ts: null, marketChecked: false, hq: {}, cust: 0 };
  G.deals.push(d); G.stats.sourced++;
  return d;
}
function genQ(channel) {
  switch (channel) {
    case 'referral': return rg(G.rng, 62, 11);
    case 'scout': return rg(G.rng, 55, 12);
    case 'cold': return rg(G.rng, 40, 15);
    case 'hot': return rg(G.rng, 82, 5);
    default: return rg(G.rng, 44, 14);
  }
}
const STAGE_W = [0.36, 0.34, 0.17, 0.08, 0.035, 0.015];
function sourceDeal(channel, opts) {
  opts = opts || {};
  const t = G.thesis, bias = biasFactor();
  let sector = opts.sector;
  if (!sector) {
    if (rc(G.rng, 0.5 * bias) && t.sectors.length) sector = rp(G.rng, t.sectors);
    else sector = rw(G.rng, SECTORS, x => 1 + Math.max(-0.6, sectorHeat(x.id))).id;
  }
  let stage = opts.stage;
  if (stage == null) {
    if (rc(G.rng, (channel === 'cold' ? 0.8 : 0.55) * bias)) stage = ri(G.rng, t.smin, t.smax);
    else stage = rw(G.rng, [0, 1, 2, 3, 4, 5], i => STAGE_W[i]);
  }
  let city = opts.city;
  if (!city) {
    if (t.geo === 'local' && rc(G.rng, 0.35 * bias)) city = G.home;
    else if (t.geo === 'region' && rc(G.rng, 0.3 * bias)) { const same = CITIES.filter(c => c.region === CITY_BY_ID[G.home].region); city = rp(G.rng, same).id; }
    else city = pickCity(G.rng, bias);
  }
  const q = opts.q != null ? opts.q : genQ(channel);
  const s = genStartup({ q, sector, stage, city, fast: channel === 'hot' });
  if (channel === 'hot') { // guarantee competition
    const f = RIVALS.filter(x => stage >= x.stages[0] && stage <= x.stages[1])[0];
    if (f && s.round.rivals.length < 2) { const fair = s.round.fair; s.round.rivals.push({ id: f.id, name: f.name, u: (f.brand - 50) / 50 + 3.2 * Math.log(1 + f.pay) - 0.1 + f.friendly * 0.8 + f.speed * 0.4 + f.va * 0.4, pre: fair * (1 + f.pay) }); }
  }
  const d = makeDeal(s, channel);
  if (channel === 'referral') d.referrer = rp(G.rng, ['a co-investor', 'a portfolio founder', 'an old colleague', 'an LP', 'a scout in your network', 'your barber (really)']);
  return d;
}

function sourcingWeek() {
  const nIn = rpois(G.rng, 2.1 + G.rep / 30);
  for (let i = 0; i < nIn; i++) sourceDeal('inbound');
  const refP = clamp(0.12 + G.net / 160 + (G.founderRel - 50) / 400, 0.05, 0.7);
  if (rc(G.rng, refP)) sourceDeal('referral');
  if (G.net > 40 && rc(G.rng, 0.12)) sourceDeal('referral');
  for (const sec of G.staff.scouts) if (rc(G.rng, 0.35)) sourceDeal('scout', { sector: sec });
  // hot deal
  if (G.week > 6 && rc(G.rng, 0.012 + G.rep / 4000)) {
    const d = sourceDeal('hot', { stage: clamp(ri(G.rng, G.thesis.smin, G.thesis.smax), 0, 5), sector: G.thesis.sectors.length ? rp(G.rng, G.thesis.sectors) : undefined, city: G.home });
    d.col = 1; d.hotUntil = G.week + 2;
    const s = G.startups[d.sid]; know(s, 'P', s.h.P + rg(G.rng, 0, 16), 16); know(s, 'F', s.h.F + rg(G.rng, 0, 16), 16);
    toast(`Hot deal: ${s.name} is raising and moving fast — 2 weeks.`, 'warn');
    logMsg(`HOT DEAL: ${s.name} (${SECTOR_BY_ID[s.sector].name}) — round closes in ~2 weeks, rivals circling.`, 'warn');
  }
}

function pipelineWeek() {
  for (const d of G.deals) {
    if (d.status !== 'open') continue;
    const s = G.startups[d.sid];
    if (!s || s.status !== 'private' || !s.round) { endDeal(d, 'lost', 'round closed'); continue; }
    const age = G.week - d.w0;
    if (d.col === 0 && age >= 5) { endDeal(d, 'expired', 'went stale'); continue; }
    // preemption
    const k = s.round.rivals.length;
    if (k && d.col >= 1 && !s.round.taken && rc(G.rng, 0.012 * k * (d.col >= 3 ? 1.4 : 1))) {
      const rv = s.round.rivals[0];
      endDeal(d, 'lost', `${rv.name} preempted`);
      s.round.end = Math.min(s.round.end, G.week + 1);
      logMsg(`${rv.name} preempted ${s.name} before you could move.`, 'warn');
      continue;
    }
    if (d.col === 4 && d.tsDeadline != null && G.week > d.tsDeadline) {
      endDeal(d, 'lost', 'term sheet window closed');
      s.round.end = Math.min(s.round.end, G.week + 1);
      logMsg(`${s.name}: your term sheet window closed — the founder signed elsewhere.`, 'warn');
    }
  }
  if (G.deals.length > 400) G.deals = G.deals.filter(d => d.status === 'open' || G.week - (d.endW || 0) < 40);
}

// ------------------------------------------------------------------ macro / heat
function updateHeat() {
  for (const sec of SECTORS) {
    G.heatOu[sec.id] = G.heatOu[sec.id] * 0.97 + rg(G.rng, 0, 0.035);
    G.heat[sec.id] = sectorHeatAt(sec, G.week, G.heatOu[sec.id]);
  }
}
function updateMacro() {
  const row = MACRO_TRANS[G.macro.regime];
  const x = rf(G.rng); let acc = 0;
  for (const k of Object.keys(row)) { acc += row[k]; if (x <= acc) { if (k !== G.macro.regime) { logMsg(`Macro regime shifts: ${MACRO[k].name}. Rates ${MACRO[k].rate}.`, k === 'bull' ? 'good' : k === 'normal' ? 'info' : 'warn'); G.macro = { regime: k, since: G.week }; } break; }
  }
}

// ------------------------------------------------------------------ the weekly tick
function personalWeekly() {
  const fee = annualFee() / 52;
  return fee - (LIVING_COST_YR + (G.car ? CAR_COST_YR : 0) + G.staff.analysts * ANALYST_YR + G.staff.scouts.length * SCOUT_YR) / 52;
}
function activeHoldings() { return Object.values(G.hold).filter(h => h.status === 'active'); }
function boardSeats() { return activeHoldings().filter(h => h.board).length; }

function advanceWeek() {
  if (G.over) return;
  const w = G.week;
  // money
  if (w < FUND_WEEKS) callCapital(annualFee() / 52, 'fee');
  G.cash += personalWeekly();
  if (G.cash < 0) {
    if (G.car) { G.car = false; logMsg('Personal cash ran dry: the car lease was cancelled.', 'bad'); }
    else if (G.staff.scouts.length) { G.staff.scouts.pop(); logMsg('Personal cash ran dry: a scout was let go.', 'bad'); }
    else if (G.staff.analysts) { G.staff.analysts--; logMsg('Personal cash ran dry: an analyst was let go.', 'bad'); }
  }
  // world
  updateHeat();
  if (w > 0 && w % 13 === 0) updateMacro();
  const ids = Object.keys(G.startups);
  for (const id of ids) stepStartup(G.startups[id]);
  pipelineWeek();
  if (!G.noSource) sourcingWeek();
  rollEvents();
  // board load
  G.boardAcc = (G.boardAcc || 0) + boardSeats() / 6.5;
  let boardAP = 0; while (G.boardAcc >= 1) { boardAP++; G.boardAcc -= 1; }
  G.apDebt += boardAP;
  // quarterly
  if ((w + 1) % 13 === 0) quarterly();
  if (w % 4 === 3) { recordHistory(); G.heatHist.push({ w, h: SECTORS.map(x => G.heat[x.id]) }); }
  // prune
  if (w % 26 === 25) pruneStartups();
  G.week++;
  G.recentToastsCleared = 0;
  if (G.week >= FUND_WEEKS) { G.over = true; finalizeFund(); return; }
  const debt = Math.min(G.apDebt, AP_BASE - 3);
  G.ap = AP_BASE - debt; G.apDebt = Math.max(0, G.apDebt - debt);
  for (const d of G.deals) d.apNote = 0;
}

function pruneStartups() {
  const keep = new Set();
  for (const d of G.deals) if (d.status === 'open') keep.add(d.sid);
  for (const k of Object.keys(G.hold)) keep.add(+k);
  for (const l of G.ledger) keep.add(l.sid);
  for (const id of Object.keys(G.startups)) {
    if (keep.has(+id)) continue;
    const s = G.startups[id];
    if (s.status === 'private' && !s.round) continue;
    if (s.status === 'private' && s.round && !s.round.taken) { // un-sourced company still alive: keep simulating a while (cheap)
      if (G.week - s.born < 150) continue;
    }
    delete G.startups[id];
  }
}

function quarterly() {
  // portfolio updates
  for (const h of activeHoldings()) {
    const s = G.startups[h.sid];
    if (s.status !== 'private') continue;
    const growth = s.h.P > 0 ? growthMo(s) : 0;
    const spinning = growth < 0.025 || runwayMo(s) < 8;
    const dish = (100 - s.h.I) / 100;
    const spin = spinning ? dish * (h.board ? 0.18 : 0.45) * (0.6 + 0.8 * hashStr(s.id + ':' + G.week) / 4294967295) : 0;
    s.report = { w: G.week, mrr: s.mrr * (1 + spin), burn: netBurn(s) * (1 - spin * 0.5), runway: runwayMo(s) * (1 + spin * 0.8), hc: headcount(s) * (1 + spin * 0.6), spun: spin > 0.06 };
    G.reportsLog = G.reportsLog || [];
  }
  const m = fundMetrics();
  const d = dateOf(G.week);
  const expected = 0.88 + 0.2 * (G.week / 52);
  let dTrust = clamp((m.tvpi - expected) * 3, -2.5, 2.5);
  if (driftLevel() > 0.3) dTrust -= 1.5;
  if (G.week < 26) dTrust = Math.max(dTrust, 0);
  G.lpTrust = clamp(G.lpTrust + dTrust, 0, 100);
  G.reports.push({ w: G.week, q: d.q, year: d.fy, tvpi: m.tvpi, dpi: m.dpi, irr: m.irr, nav: m.nav, trust: G.lpTrust, drift: driftLevel() });
  logMsg(`Q${d.q} LP report sent — TVPI ${fx(m.tvpi)}, DPI ${fx(m.dpi)}. LP trust ${Math.round(G.lpTrust)}.`, 'info');
  // staff thinking about leaving? (kept simple)
}

// ------------------------------------------------------------------ random events
function rollEvents() {
  const hs = activeHoldings();
  for (const h of hs) {
    const s = G.startups[h.sid];
    if (s.status !== 'private') continue;
    if (G.queue.some(e => e.sid === h.sid)) continue;
    if (!rc(G.rng, 0.010)) continue;
    const opts = [
      ['cofounder', 1.0 + clamp((60 - s.h.F) / 35, -0.6, 1.5)],
      ['custlost', s.mrr > 40e3 ? 0.9 : 0.1],
      ['competitor', 0.8],
      ['regulatory', (s.sector === 'fin' || s.sector === 'health') ? 1.3 : 0.2],
      ['poach', s.done >= 1 ? 0.7 : 0.1],
      ['scandal', clamp(0.25 + (55 - s.h.I) / 50, 0.05, 1.2)],
      ['acquihire', (s.h.P < 48 && s.done <= 2 && s.mrr < 1e6) ? 0.9 : 0.05],
    ];
    const pick = rw(G.rng, opts, o => o[1])[0];
    pushEvent(pick, s.id);
  }
  if (G.week > 52 && rc(G.rng, 0.006)) pushEvent('lpliquidity', 0);
  if (G.week > 20 && rc(G.rng, 0.006) && hs.length) pushEvent('leak', hs[Math.floor(rf(G.rng) * hs.length)].sid);
}

function finalizeFund() {
  G.over = true;
  const m = fundMetrics(true);
  G.final = m;
  recordHistory();
}

// ============================================================================
// ACTIONS: everything the player can spend AP on
// All return {ok:bool, msg:string,...}; UI shows msg as a toast on failure.
// ============================================================================

const COL_NAMES = ['Sourced', 'Screened', 'Meeting', 'Diligence', 'Term sheet'];
const TOOL_INFO = {
  data: { name: 'Data room', ap: COST.data, cash: 0, desc: 'Revenue, burn, growth. Founders can window-dress it.' },
  refs: { name: 'Founder references', ap: COST.refs, cash: 0, desc: 'Integrity and team dynamics. References are hand-picked.' },
  cust: { name: 'Customer calls', ap: COST.cust, cash: 0, desc: 'Real product-market fit. Up to 3 rounds of calls.' },
  tech: { name: 'Technical expert', ap: COST.tech, cash: CASHCOST.tech, desc: 'Paid expert: does the tech actually work?' },
  bg:   { name: 'Background check', ap: COST.bg, cash: CASHCOST.bg, desc: 'Fraud history, litigation, odd corporate filings.' },
};
const TOOL_ORDER = ['data', 'refs', 'cust', 'tech', 'bg'];

const fail = msg => ({ ok: false, msg });
const okr = (msg, extra) => Object.assign({ ok: true, msg }, extra || {});
function spendAp(n) { if (G.ap < n) return false; G.ap -= n; return true; }
function dealStartup(d) { return G.startups[d.sid]; }
function note(d, tag, text, kind) { d.notes.push({ w: G.week, tag, text, kind: kind || 'info' }); }
function opexCall(amt) { if (amt > 0) callCapital(amt, 'opex'); }

// ---------------------------------------------------------------- pipeline moves
function gateRep(d) {
  const s = dealStartup(d);
  return Math.max(0, Math.round((s.q - 68) * 1.6 - (d.channel === 'referral' ? 12 : 0)));
}
function advanceCost(d) { return [COST.screen, COST.meet, COST.dd, COST.ts][d.col] || 0; }
function canAdvance(d) {
  if (d.status !== 'open') return fail('Deal is closed.');
  if (d.col >= 4) return fail('Already at term sheet.');
  const s = dealStartup(d);
  if (!s || !s.round) return fail('The round has closed.');
  if (G.ap < advanceCost(d)) return fail(`Needs ${advanceCost(d)} AP.`);
  if (d.movedW === G.week && !(d.hotUntil && G.week <= d.hotUntil)) return fail('Founders need a week to respond — try next turn.');
  if (d.col === 1 && G.rep < gateRep(d)) return fail(`Founder won't take your call yet (needs reputation ${gateRep(d)}; you have ${Math.round(G.rep)}).`);
  if (d.col === 3 && G.week > s.round.end) return fail('Round is closing.');
  return { ok: true };
}
function advanceDeal(d) {
  const c = canAdvance(d); if (!c.ok) return c;
  const s = dealStartup(d);
  spendAp(advanceCost(d));
  d.movedW = G.week;
  if (d.col === 0) {
    know(s, 'P', s.h.P + (s.dress * 50) + rg(G.rng, 0, 30 * noiseMult()), 30);
    know(s, 'T', s.h.T + rg(G.rng, 0, 26 * noiseMult()), 26);
    know(s, 'F', s.h.F + rg(G.rng, 0, 28 * noiseMult()), 28);
    d.col = 1;
    note(d, 'Deck', `Skimmed the deck: ${s.pitch}. ${thesisFit(s).ok ? 'Squarely on-thesis.' : 'Off-thesis — would count as drift.'}`);
  } else if (d.col === 1) {
    observe(s, 'F', 16); observe(s, 'I', 30); observe(s, 'T', 24);
    d.col = 2;
    note(d, 'Meeting', `Met ${s.founder.name}. ${s.founder.quirk}.`);
  } else if (d.col === 2) {
    d.col = 3;
    note(d, 'Diligence', 'Diligence started — the toolkit is open.');
  } else if (d.col === 3) {
    d.col = 4;
    d.ts = defaultTerms(d);
    const k = s.round.rivals.length;

function xirr(flows) {
  let hasNeg = false, hasPos = false;
  for (const f of flows) { if (f.a < 0) hasNeg = true; if (f.a > 0) hasPos = true; }
  if (!hasNeg || !hasPos) return null;
  const npv = r => { let t = 0; for (const f of flows) t += f.a / Math.pow(1 + r, f.w / 52); return t; };
  let lo = -0.95, hi = 4;
  let flo = npv(lo), fhi = npv(hi);
  if (flo * fhi > 0) return flo > 0 ? hi : lo;
  for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2, fm_ = npv(mid); if (flo * fm_ <= 0) { hi = mid; fhi = fm_; } else { lo = mid; flo = fm_; } }
  return (lo + hi) / 2;
}

function positionValue(h, final) {
  const s = G.startups[h.sid];
  if (!s) return 0;
  if (s.status === 'public') return publicValue(h);
  const v = holdingMark(h);
  return final ? v * 0.85 : v;
}

function fundMetrics(final) {
  let nav = Math.max(0, G.fundCash);
  for (const h of activeHoldings()) nav += positionValue(h, final);
  const paidIn = Math.max(1, G.called);
  const carryAccrued = CARRY_PCT * Math.max(0, G.dist + nav - paidIn);
  const carryUnpaid = Math.max(0, carryAccrued - G.carryPaid);
  const netNav = nav - carryUnpaid;
  const dpi = (G.dist - G.carryPaid) / paidIn;
  const tvpi = (G.dist - G.carryPaid + netNav) / paidIn;
  const irr = G.week < 52 && !final ? null : xirr(G.flows.concat([{ w: G.week, a: netNav }]));
  return { nav, netNav, paidIn, tvpi, dpi, irr, carryAccrued, carryUnpaid };
}

function scoreFund(m) {
  const irr = m.irr == null ? -0.2 : m.irr;
  const a = clamp(irr / 0.25, 0, 1), b = clamp((m.tvpi - 1) / 2.5, 0, 1), c = clamp(m.dpi / 3, 0, 1);
  const base = 100 * (0.35 * a + 0.35 * b + 0.30 * c);
  const repBonus = clamp(G.rep / 100, 0, 1) * 6;
  const score = Math.round(base + repBonus);
  const T = [
    [92, 'S', 'Hall of Fame GP'], [78, 'A', 'Top-decile manager'], [60, 'B', 'Top-quartile manager'],
    [42, 'C', 'Respectable median'], [22, 'D', 'LPs politely stop returning your calls'], [0, 'F', 'The haircut was the best investment you made'],
  ];
  const t = T.find(x => score >= x[0]);
  return { score, base: Math.round(base), repBonus: Math.round(repBonus * 10) / 10, grade: t[1], title: t[2] };
}

// helper summaries for UI
function portfolioRows() {
  const rows = [];
  for (const h of Object.values(G.hold)) {
    const s = G.startups[h.sid]; if (!s) continue;
    const active = h.status === 'active';
    const mark = active ? positionValue(h) : 0;
    rows.push({ h, s, active, mark, moic: (mark + h.realized) / Math.max(1, h.invested), own: ownPct(s, h) });
  }
  rows.sort((a, b) => (b.active - a.active) || (b.mark + b.h.realized) - (a.mark + a.h.realized));
  return rows;
}

function proRataAmt(s, h) {
  const own = ownPct(s, h);
  const rd = s.round; if (!rd) return 0;
  return Math.round(own * rd.raise * (h.prorata ? 1 : 0.5) / 5000) * 5000;
}
function bridgeAmt(s) { return Math.round(clamp(netBurn(s) * 6, 60e3, G.size * 0.15) / 10000) * 10000; }
function saleValue(s) { return acqhireEV(s); }

function needAp(o) { if (o.ap > G.ap) { o.disabled = true; o.why = `Needs ${o.ap} AP`; } return o; }

function lpAsk() { return Math.round(G.size * 0.03 / 5000) * 5000; }
function acqhireVal(s) { if (!s._ah || s._ah.w !== G.week) s._ah = { w: G.week, v: acqhireEV(s) * 1.1 }; return s._ah.v; }
function downInfo(s, ev) {
  const h = G.hold[s.id];
  if (!ev.data.pre) {
    const pre = lastPost(s) * rr(s.rs, 0.4, 0.6), k = s.done + 1;
    const raise = Math.max(stg(k).raise * 0.3, netBurn(s) * 12);
    ev.data.pre = pre; ev.data.raise = raise;
  }
  const pre = ev.data.pre, raise = ev.data.raise;
  const own = ownPct(s, h);
  return { pre, raise, slice: Math.round(own * raise / 5000) * 5000 };
}
function afterDown(s) {
  if (s.antiTriggered) { s.antiTriggered = false; pushEvent('antidil', s.id); }
  s.stallUntil = G.week + 4;

function drawNextStep(d, s, x, y, w, h) {
  panel(x, y, w, h, 'NEXT STEP');

    'Open diligence. Unlocks the data room, references, customer calls, the technical expert, background check and HQ visits.',
    'Prepare a term sheet. Founders will compare you with rivals, so decide how hard to push on price and terms.',
  ][d.col];
  const hh = P(blurb, x + 14, y + 34, w - 28, { s: 12.5, c: C.dim });
  if (d.col === 1 && !c.ok && c.msg && c.msg.includes('reputation')) P('Great founders only take your call at high reputation. A referral lowers the bar.', x + 14, y + 40 + hh, w - 28, { s: 12, c: C.amber });
  if (button('dadv', x + 14, y + h - 150, w - 28, 44, `Move to ${next}`, { kind: 'primary', sub: `${advanceCost(d)} AP`, disabled: !c.ok, why: c.msg, s: 14 })) act(advanceDeal(d));
  if (button('dmkt', x + 14, y + h - 98, w - 28, 34, d.marketChecked ? 'Asked around ✓' : `Ask around about rivals · ${COST.market} AP`, { disabled: d.marketChecked || d.col < 1 || G.ap < 1, why: d.col < 1 ? 'Screen the deal first.' : d.marketChecked ? '' : 'Not enough AP.', s: 12 })) act(marketCheck(d));
  if (button('dpass', x + 14, y + h - 56, w - 28, 34, 'Pass on this deal', { kind: 'danger', s: 12.5 })) { passDeal(d); }

  }
}

// ---- term sheet builder
function drawTermBuilder(d, s, x, y, w, h) {
  const rd = s.round, t = d.ts || (d.ts = defaultTerms(d));
  panel(x, y, w, h, 'TERM SHEET');
  const lim = checkLimits(d, t);
  t.check = clamp(Math.round(t.check / 5000) * 5000, lim.lo, lim.hi);
  let ry = y + 34;
  const lx = x + 14, cw = w - 28;
  // role
  if (!rd.safe) {
    if (button('tlead', lx, ry, cw / 2 - 3, 28, 'Lead', { kind: t.lead ? 'primary' : 'ghost', s: 12.5, tip: 'Set the price and terms, take a board seat. Needs ≥25% of the round.' })) { t.lead = true; t.board = true; t.prorata = true; }
    if (button('tfol', lx + cw / 2 + 3, ry, cw / 2 - 3, 28, 'Follow', { kind: !t.lead ? 'primary' : 'ghost', s: 12.5, tip: 'Take a smaller slice at someone else\'s price and standard terms (1x non-participating, broad-based anti-dilution).' })) { t.lead = false; t.board = false; t.prorata = false; t.pref = '1x'; t.anti = 'wa'; t.pool = 0.10; }
    ry += 36;
  } else { T('SAFE — converts at the next priced round', lx, ry + 10, { s: 12, c: C.dim }); ry += 26; }
  const pv0 = termsPreview(d, t);
  // valuation
  if (rd.safe || t.lead) {
    T(rd.safe ? `Cap ${fm(rd.ask * t.valPct)}` : `Pre-money ${fm(rd.ask * t.valPct)}`, lx, ry + 8, { s: 12.5, w: 700 });
    T(`${Math.round(t.valPct * 100)}% of ask`, lx + cw, ry + 8, { s: 11.5, c: t.valPct > 1.02 ? C.green : t.valPct < 0.9 ? C.amber : C.dim, a: 'right' });
    t.valPct = slider('tval', lx, ry + 18, cw, t.valPct, 0.6, 1.25, 0.01);
    ry += 40;
  } else { T(`Price set by the lead: ${fm(followPre(d))} pre`, lx, ry + 8, { s: 12.5, w: 700 }); ry += 28; }
  // check
  T(`Check ${fm(t.check)}`, lx, ry + 8, { s: 12.5, w: 700 }); T(`range ${fm(lim.lo)}–${fm(lim.hi)}`, lx + cw, ry + 8, { s: 11, c: C.faint, a: 'right' });
  t.check = slider('tchk', lx, ry + 18, cw, t.check, lim.lo, lim.hi, 5000);
  ry += 40;
  // terms
  if (t.safe) {
    t.mfn = toggle('tmfn', lx, ry, 'MFN clause', t.mfn, { tip: 'If a later SAFE gets a lower cap, yours matches it.' });
    t.disc = toggle('tdisc', lx + 140, ry, '20% discount', !!t.disc, { tip: 'Converts at the lower of the cap and a 20% discount to the round price.' }) ? 0.2 : 0;
    t.prorata = toggle('tpro', lx, ry + 26, 'Pro-rata side letter', t.prorata);
    ry += 54;
  } else if (t.lead) {
    t.board = toggle('tboard', lx, ry, 'Board seat', t.board, { tip: 'Votes on exits and founder replacement, less spin in reports. Costs ~1 AP per quarter.' });
    t.prorata = toggle('tpro', lx + 150, ry, 'Pro-rata rights', t.prorata, { tip: 'Right to keep your percentage in later rounds.' });
    ry += 28;
    const dd = stepper('tpool', lx, ry, cw + 120 - 120, 'Option pool (post)', Math.round(t.pool * 100) + '%', t.pool > 0.08, t.pool < 0.20); if (dd) t.pool = clamp(t.pool + dd * 0.02, 0.08, 0.20);
    ry += 30;
    T('Liquidation preference', lx, ry + 8, { s: 11.5, c: C.dim }); ry += 18;
    if (button('tp1', lx, ry, cw / 2 - 3, 26, '1x non-participating', { kind: t.pref === '1x' ? 'primary' : 'ghost', s: 11 })) t.pref = '1x';
    if (button('tp2', lx + cw / 2 + 3, ry, cw / 2 - 3, 26, 'Participating', { kind: t.pref === 'part' ? 'primary' : 'ghost', s: 11, tip: 'You get your money back AND your share. Founders hate it.' })) t.pref = 'part';
    ry += 32;
    T('Anti-dilution', lx, ry + 8, { s: 11.5, c: C.dim }); ry += 18;
    [['none', 'None'], ['wa', 'Broad-based'], ['ratchet', 'Full ratchet']].forEach((o, i) => { if (button('ta' + o[0], lx + i * (cw / 3), ry, cw / 3 - 3, 26, o[1], { kind: t.anti === o[0] ? 'primary' : 'ghost', s: 11, tip: o[0] === 'ratchet' ? 'Very aggressive: resets your price to any down-round price. Founders may walk.' : '' })) t.anti = o[0]; });
    ry += 34;
  } else {
    T('Standard terms: 1x non-participating, broad-based anti-dilution.', lx, ry + 6, { s: 11, c: C.faint, maxW: cw }); ry += 24;
  }
  // preview
  const pv = termsPreview(d, t), p = winProb(d, t);
  box(lx, ry, cw, 52, C.bg, C.line, 6);
  T(`You own ≈ ${fp(pv.own, 2)} at close`, lx + 10, ry + 14, { s: 12.5, w: 700 });
  T(`${t.safe ? 'cap' : 'post'} ${fm(t.safe ? rd.ask * t.valPct : pv.post)} · cost ${fm(t.check)} + legal ${fm(t.safe ? CASHCOST.legalSafe : CASHCOST.legalPriced)}`, lx + 10, ry + 33, { s: 11, c: C.dim, maxW: cw - 20 });
  ry += 60;
  // founder meter
  const fz = (((d.id * 37) % 11) - 5) * 0.02, pf = d.marketChecked ? p : clamp(p + fz, 0, 1);
  T('Founder mood', lx, ry + 8, { s: 12, c: C.dim }); T(founderMood(pf) + (d.marketChecked ? ` · ${Math.round(p * 100)}%` : ''), lx + cw, ry + 8, { s: 12.5, w: 800, c: pf > 0.55 ? C.green : pf > 0.3 ? C.gold : C.red, a: 'right' });
  bar(lx, ry + 20, cw, 8, pf, pf > 0.55 ? C.green : pf > 0.3 ? C.gold : C.red);
  tip(lx, ry, cw, 30, 'Founders weigh price, terms, your brand, your speed and your value-add against rival offers. Ask around to see the exact odds.');
  ry += 36;
  if (rd.rivals.length && d.marketChecked) {
    rd.rivals.forEach(r => { T(`${r.name}: ~${fm(r.pre)} pre`, lx, ry + 7, { s: 11, c: C.amber, maxW: cw }); ry += 15; });
  } else if (rd.rivals.length) { T(`${buzz(d, s) ? 'Others are circling.' : 'Looks quiet.'} Ask around for names.`, lx, ry + 7, { s: 11, c: C.faint }); ry += 15; }
  const sendY = y + h - 92;
  const budgetOk = t.check <= lim.funds + 1;
  T(`Initial-check budget ${fm(lim.funds)}`, lx, sendY - 8, { s: 11, c: budgetOk ? C.faint : C.red });
  if (button('tsend', lx, sendY + 4, cw, 42, 'Send term sheet', { kind: 'primary', sub: `${COST.send} AP · window ${Math.max(0, (d.tsDeadline != null ? d.tsDeadline : rd.end) - G.week)}w`, disabled: G.ap < COST.send || !budgetOk, why: !budgetOk ? 'Over your initial-check budget (reserves are held back).' : 'Not enough AP.', s: 14 })) {
    const r = sendTermSheet(d, t);
    if (r.ok === false) act(r);
    else if (r.won) { stampFx('SIGNED', C.green); sfx('good'); flash(r.msg, 'good'); }
    else { stampFx('LOST', C.red); sfx('bad'); flash(r.msg, 'bad'); }
  }
  if (button('tpass', lx, sendY + 52, cw / 2 - 3, 28, 'Pass', { kind: 'danger', s: 12 })) passDeal(d);
  if (button('tmkt', lx + cw / 2 + 3, sendY + 52, cw / 2 - 3, 28, d.marketChecked ? 'Asked ✓' : 'Ask around · 1 AP', { disabled: d.marketChecked || G.ap < 1, s: 11.5 })) act(marketCheck(d));
}

// ---- HQ scene
function drawHQScene(d, s) {
  const v = S.dealView.hq; if (!v) return;
  ctx.fillStyle = 'rgba(2,5,9,0.8)'; ctx.fillRect(0, 51, W, H - 51);
  const x0 = 170, y0 = 90, w0 = 940, h0 = 540;
  box(x0, y0, w0, h0, C.bg2, C.gold, 12);
  T(`${s.name} — HQ, ${CITY_BY_ID[s.city].name}`, x0 + 22, y0 + 24, { s: 18, w: 800 });
  T(HQ_FOCUS[v.focus].name, x0 + w0 - 70, y0 + 24, { s: 12.5, c: C.gold, a: 'right', w: 700 });
  if (button('hqx', x0 + w0 - 56, y0 + 10, 40, 28, '✕', {})) { S.dealView.hq = null; return; }
  // scene area
  const sx = x0 + 20, sy = y0 + 46, sw = w0 - 40, sh = 380;
  const r = mkrng(hashStr('hq' + s.id));
  ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
  ctx.fillStyle = '#1b2733'; ctx.fillRect(sx, sy, sw, sh);
  ctx.fillStyle = '#243548'; ctx.fillRect(sx, sy + 150, sw, sh - 150);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; for (let i = 0; i < 20; i++) { ctx.beginPath(); ctx.moveTo(sx + i * 50, sy + 150); ctx.lineTo(sx + i * 50 - 60, sy + sh); ctx.stroke(); }
  // windows
  for (let i = 0; i < 3; i++) { ctx.fillStyle = '#3b5f86'; ctx.fillRect(sx + 20 + i * 80, sy + 24, 62, 78); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(sx + 20 + i * 80, sy + 24, 62, 30); }
  // whiteboard
  const wbx = sx + 290, wby = sy + 20, wbw = 330, wbh = 112;
  ctx.fillStyle = '#e9eef2'; ctx.fillRect(wbx, wby, wbw, wbh); ctx.strokeStyle = '#8c9aa6'; ctx.lineWidth = 3; ctx.strokeRect(wbx, wby, wbw, wbh);
  const run = runwayMo(s), hc = headcount(s);
  ctx.font = fontStr(15, 800, true); ctx.fillStyle = '#c0392b'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`RUNWAY: ${run > 40 ? '40+' : run.toFixed(0)} MO`, wbx + 16, wby + 26);
  ctx.fillStyle = '#2c3e50'; ctx.font = fontStr(12, 600, true);
  ctx.fillText(`burn ${fm(Math.max(0, netBurn(s)))}/mo`, wbx + 16, wby + 50);
  ctx.fillText(s.h.B > 55 ? 'plan: hire 2, ship v2' : s.h.B > 35 ? 'plan: hire 6?? (see Q3)' : 'plan: ??? → profit?', wbx + 16, wby + 72);
  ctx.strokeStyle = '#2c7a4b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wbx + 200, wby + 90); for (let i = 0; i < 6; i++) ctx.lineTo(wbx + 200 + i * 22, wby + 90 - (s.h.P > 50 ? i * 8 : i % 2 * 12)); ctx.stroke();
  // desks
  const desks = clamp(Math.ceil(hc * 1.35) + 2, 6, 18), per = Math.ceil(desks / 3);
  const occupied = Math.min(desks, hc), order = []; for (let i = 0; i < desks; i++) order.push(i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rf(r) * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const occ = new Set(order.slice(0, occupied));
  for (let i = 0; i < desks; i++) {
    const row = Math.floor(i / per), colI = i % per;
    const dx = sx + 40 + colI * Math.min(110, (sw - 260) / per), dy = sy + 190 + row * 62;
    ctx.fillStyle = '#5a4630'; ctx.fillRect(dx, dy + 18, 70, 12);
    ctx.fillStyle = '#10161c'; ctx.fillRect(dx + 20, dy, 30, 20);
    ctx.fillStyle = occ.has(i) ? '#6fb7ff' : '#26323d'; ctx.fillRect(dx + 22, dy + 2, 26, 14);
    if (occ.has(i)) {
      const slump = s.h.F < 42 ? 4 : 0;
      ctx.fillStyle = ['#d98c5f', '#c9a07a', '#8d5a3b', '#f0c9a0'][ri(r, 0, 3)]; ctx.beginPath(); ctx.arc(dx + 35, dy + 30 + slump, 7, 0, 6.3); ctx.fill();
      ctx.fillStyle = s.h.F > 60 ? '#4cc38a' : s.h.F > 42 ? '#7a8fb5' : '#8a6a6a'; ctx.fillRect(dx + 27, dy + 37 + slump, 16, 14);
    } else { ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(dx + 8, dy + 20, 54, 4); }
  }
  // trash + plant clues
  if (s.h.B < 40) { ctx.fillStyle = '#6b4f3a'; for (let i = 0; i < 5; i++) ctx.fillRect(sx + 24 + i * 7, sy + sh - 34 - (i % 2) * 6, 6, 12); }
  ctx.fillStyle = s.h.F > 50 ? '#3f8f4f' : '#8a7a3f'; ctx.beginPath(); ctx.arc(sx + sw - 250, sy + 130, 16, 0, 6.3); ctx.fill(); ctx.fillStyle = '#6b4a2f'; ctx.fillRect(sx + sw - 258, sy + 140, 16, 14);
  // product screen (demo)
  const psx = sx + sw - 220, psy = sy + 40;
  ctx.fillStyle = '#0f1419'; ctx.fillRect(psx, psy, 190, 110); ctx.strokeStyle = '#555'; ctx.strokeRect(psx, psy, 190, 110);
  if (s.h.X > 50) { ctx.fillStyle = '#4cc38a'; for (let i = 0; i < 6; i++) ctx.fillRect(psx + 14 + i * 28, psy + 96 - (10 + (i * 37 % 60)), 18, 10 + (i * 37 % 60)); T('LIVE DEMO · OK', psx + 95, psy + 12, { s: 10, c: C.green, a: 'center', mono: true }); }
  else { ctx.fillStyle = '#ef6461'; T('ERROR 500', psx + 95, psy + 50, { s: 14, w: 800, c: C.red, a: 'center', mono: true }); T('works on my machine', psx + 95, psy + 74, { s: 10.5, c: C.dim, a: 'center', mono: true }); }
  // founder
  const fxp = sx + sw - 90, fyp = sy + 250;
  ctx.fillStyle = '#e0b48c'; ctx.beginPath(); ctx.arc(fxp, fyp, 15, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#22262b'; ctx.fillRect(fxp - 15, fyp - 17, 30, 9); // hair
  ctx.fillStyle = s.fraud ? '#6b4a8a' : '#3b6ea5'; ctx.fillRect(fxp - 17, fyp + 15, 34, 46);
  const honest = s.h.I > 48;
  const said = honest ? 'Honest answer: churn is 4%.\nWe are fixing onboarding.' : 'Great question! Actually,\ncan we circle back to that?';
  const bw = 214, bx = fxp - bw - 20, by = fyp - 44;
  ctx.fillStyle = '#f2f5f8'; rrect(bx, by, bw, 50, 8); ctx.fill();
  said.split('\n').forEach((l, i) => T(l, bx + 10, by + 15 + i * 18, { s: 12, c: '#1b2733', w: 600 }));
  ctx.restore();
  // clue summary
  T(`Real headcount: ${hc}${d.reported ? `  (they told you ${d.reported.hc})` : ''}`, x0 + 22, y0 + 446, { s: 13, w: 700 });
  const last = d.notes.filter(n => n.tag === 'HQ visit').slice(-1)[0];
  if (last) P(last.text, x0 + 22, y0 + 462, w0 - 44, { s: 13, c: C.dim });
  T('Hover the scene for clues: the whiteboard, the empty desks, the demo screen and the founder all tell you something.', x0 + 22, y0 + 524, { s: 11, c: C.faint });
  tip(wbx, wby, wbw, wbh, `Whiteboard: runway countdown and burn plan. ${s.h.B < 40 ? 'The plan is… optimistic.' : ''}`);
  tip(sx, sy + 190, sw - 260, 190, `${occupied} of ${desks} desks occupied.${d.reported ? ' They claimed ' + d.reported.hc + ' people.' : ''}`);
  tip(psx, psy, 190, 110, 'The product demo screen.');

function statusLabel(s, h) {

function trLabel(t) {

}

function capRows(s) {
  const f = fd(s), rows = [{ n: 'Founders', v: s.cap.founders }, { n: 'Option pool', v: s.cap.pool }];
  for (const i of s.cap.inv) rows.push({ n: i.name, v: i.shares });
  const h = G.hold[s.id];
  if (h) { const mine = sum(h.tr, t => t.shares || 0); if (mine > 0) rows.push({ n: 'You', v: mine, me: true }); }
  const merged = []; // merge repeated investor names
  for (const r of rows) { const m = merged.find(x => x.n === r.n && !x.me); if (m && !r.me) m.v += r.v; else merged.push(Object.assign({}, r)); }
  return { rows: merged, f };
}

// ============================================================================
// MAIN: boot, canvas scaling, input, game loop, save / load
// ============================================================================
const SAVE_KEY = 'termsheet.save.v1';
function localStorage_get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

const _rep = (k, v) => v === Infinity ? '__inf__' : v;
const _rev = (k, v) => v === '__inf__' ? Infinity : v;
function saveGame(silent) {
  if (!G) return false;
  const ok = localStorage_set(SAVE_KEY, JSON.stringify(G, _rep));
  if (!ok && !silent) flash('Could not save (storage unavailable).', 'bad');
  return ok;
}
function hasSave() { return !!localStorage_get(SAVE_KEY); }
function loadGame() {
  try {
    const g = JSON.parse(localStorage_get(SAVE_KEY), _rev);
    setG(g); g.toasts = []; S.screen = 'game'; S.modal = null; S.scroll = {}; S.selHold = 0; S.endShown = false; S.help = false;
    flash('Game loaded.', 'good');

}

function drainToasts() { if (!G || !G.toasts) return; for (const t of G.toasts) flash(t.t, t.k); G.toasts.length = 0; }
function afterWeek() {
  drainToasts(); sfx('turn');

}
function doEndTurn() { if (!G || G.over || G.queue.length) return; endTurn(); afterWeek(); }
function doSkip(n) { if (!G || G.over || G.queue.length) return; const k = skipWeeks(n); afterWeek(); if (G.queue.length) flash(`Stopped after ${k} week${k === 1 ? '' : 's'}: a decision needs you.`, 'warn'); }

// ---------------------------------------------------------------- canvas / input
let _dpr = 1, _scale = 1, _offX = 0, _offY = 0, _last = 0;
function resize() {

  cv.width = Math.round(w * _dpr); cv.height = Math.round(h * _dpr);
  _scale = Math.min(w / W, h / H); _offX = (w - W * _scale) / 2; _offY = (h - H * _scale) / 2;
}

function topLayer() {
  if (G && G.over && !S.endShown && S.screen === 'game') return 'end';
  if (S.help) return 'help';
  if (S.menu) return 'menu';
  if (G && G.queue.length && S.screen === 'game') return 'event';
  if (S.modal) return 'deal';
  return 'base';
}
function drawGame() {
  const top = topLayer(), off = l => (top !== l ? 1 : 0);
  UI.disabled += off('base');
  drawFrame();
  ({ pipeline: drawPipeline, portfolio: drawPortfolio, fund: drawFund, office: drawOffice, market: drawMarket }[S.tab] || drawPipeline)();
  UI.disabled -= off('base');
  if (S.modal) { UI.disabled += off('deal'); drawDealModal(); UI.disabled -= off('deal'); }
  if (G.queue.length && !G.over) { UI.disabled += off('event'); drawEventModal(); UI.disabled -= off('event'); }
  if (S.menu) { UI.disabled += off('menu'); drawMenu(); UI.disabled -= off('menu'); }
  if (S.help) { UI.disabled += off('help'); drawHelp(); UI.disabled -= off('help'); }
  if (G.over && !S.endShown) drawEnd();
}

function frame(ts) {
  UI.dt = Math.min(0.05, (ts - _last) / 1000); _last = ts; UI.t += UI.dt;
  UI.tips.length = 0; UI.cursor = 'default';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#080c11'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(_dpr * _scale, 0, 0, _dpr * _scale, _dpr * _offX, _dpr * _offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

    drawToasts(); drawTips();
  } catch (e) { console.error(e); ctx.restore(); ctx.save(); T('Error: ' + e.message, 20, 20, { c: C.red }); window.__lastError = e; }
  ctx.restore();

  UI.ox = 0; UI.oy = 0; UI.clips.length = 0; UI.stack.length = 0; UI.disabled = 0;

}

function onKey(e) {
  if (UI.focus) {
    if (e.key === 'Escape' || e.key === 'Enter') { UI.focus = null; e.preventDefault(); return; }
    if (e.key === 'Backspace' || e.key.length === 1) { UI.keyQ.push(e.key); e.preventDefault(); }

  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (S.screen !== 'game' || !G) return;
  const top = topLayer();
  if (e.key === 'Escape') { if (S.help) S.help = false; else if (S.menu) S.menu = false; else if (S.dealView.hq) S.dealView.hq = null; else if (S.modal) closeModal(); else S.menu = true; e.preventDefault(); return; }
  if (top !== 'base') return;
  if (e.key === ' ' || e.key === 'Enter') { doEndTurn(); e.preventDefault(); }
  else if (e.key >= '1' && e.key <= '5') S.tab = TABS[+e.key - 1][0];
}

function boot() {
  cv = document.getElementById('c'); ctx = cv.getContext('2d');
  resize(); window.addEventListener('resize', resize);
  const upd = e => { const p = toLogical(e); UI.mx = p[0]; UI.my = p[1]; };

  window.__ts = { get G() { return G; }, S, UI, toPage: (x, y) => { const r = cv.getBoundingClientRect(); return [r.left + _offX + x * _scale, r.top + _offY + y * _scale]; }, api: { startNewGame, doEndTurn, doSkip, openDeal, advanceDeal, useTool, hqVisit, sendTermSheet, defaultTerms, resolveEvent, eventView, loadGame, saveGame, initSetup, newGame, closeModal } };

}
if (typeof document !== 'undefined' && document.getElementById('c')) boot();
